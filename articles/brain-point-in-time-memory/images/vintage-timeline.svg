<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Which revenue version a June forecast can use</title>
  <desc id="desc">The quarter ends on March 31. A $100 million figure is released May 8 and received May 9, before a June 15 forecast. A $96 million restatement arrives July 12, after the cutoff, so it cannot enter the June replay.</desc>
  <rect width="1000" height="330" fill="#f7f9fc"/>
  <text x="48" y="42" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#12243a">What the June forecast could know</text>
  <text x="48" y="72" font-family="Arial, sans-serif" font-size="15" fill="#34465a">Synthetic quarterly revenue example · system-availability policy</text>
  <line x1="95" y1="160" x2="910" y2="160" stroke="#58708b" stroke-width="3"/>
  <path d="M910 160 l-12 -7 v14 z" fill="#58708b"/>
  <rect x="532" y="93" width="12" height="155" fill="#dcecf5"/>
  <line x1="538" y1="91" x2="538" y2="250" stroke="#126b90" stroke-width="3" stroke-dasharray="7 6"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="115" cy="160" r="8" fill="#718397"/>
    <text x="115" y="135" font-size="16" font-weight="700" fill="#12243a">Mar 31</text>
    <text x="115" y="189" font-size="14" fill="#34465a">Quarter ends</text>
    <circle cx="310" cy="160" r="8" fill="#168064"/>
    <text x="310" y="135" font-size="16" font-weight="700" fill="#12243a">May 8</text>
    <text x="310" y="189" font-size="14" fill="#34465a">$100m released</text>
    <circle cx="415" cy="160" r="8" fill="#168064"/>
    <text x="415" y="135" font-size="16" font-weight="700" fill="#12243a">May 9</text>
    <text x="415" y="189" font-size="14" fill="#34465a">Feed receives it</text>
    <circle cx="538" cy="160" r="10" fill="#126b90"/>
    <text x="538" y="118" font-size="17" font-weight="700" fill="#075b7d">Jun 15 cutoff</text>
    <text x="538" y="226" font-size="14" fill="#075b7d">Use $100m</text>
    <circle cx="780" cy="160" r="8" fill="#b65343"/>
    <text x="780" y="135" font-size="16" font-weight="700" fill="#12243a">Jul 12</text>
    <text x="780" y="189" font-size="14" fill="#34465a">$96m restatement</text>
    <text x="780" y="226" font-size="14" fill="#a43d31">Too late for June</text>
  </g>
  <rect x="89" y="266" width="440" height="41" rx="6" fill="#e2f3ec"/>
  <text x="105" y="292" font-family="Arial, sans-serif" font-size="15" fill="#185b47">Eligible: published and received before cutoff</text>
  <rect x="551" y="266" width="355" height="41" rx="6" fill="#fae9e5"/>
  <text x="567" y="292" font-family="Arial, sans-serif" font-size="15" fill="#873a30">Ineligible: revision after cutoff</text>
</svg>
