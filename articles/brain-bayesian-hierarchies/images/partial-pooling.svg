<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">Partial pooling and two kinds of uncertainty</title>
  <desc id="desc">A group mean of one percent and a noisy company mean of three percent combine to a posterior mean of two percent. The interval for the unknown mean is narrower than the predictive interval for a new return.</desc>
  <rect width="960" height="580" fill="#f8fafc"/>
  <text x="48" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#132b3a">When four observations are not enough</text>
  <text x="48" y="84" font-family="Arial, sans-serif" font-size="16" fill="#405969">Synthetic five-session return example · values in percentage points</text>
  <line x1="315" y1="466" x2="855" y2="466" stroke="#637989" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#294455" text-anchor="middle">
    <text x="315" y="496">−2</text><text x="405" y="496">−1</text><text x="495" y="496">0</text><text x="585" y="496">1</text><text x="675" y="496">2</text><text x="765" y="496">3</text><text x="855" y="496">4</text>
  </g>
  <g stroke="#dce4e9" stroke-width="1"><line x1="495" y1="112" x2="495" y2="466"/><line x1="585" y1="112" x2="585" y2="466"/><line x1="675" y1="112" x2="675" y2="466"/><line x1="765" y1="112" x2="765" y2="466"/></g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#17364a">
    <text x="48" y="139">Group mean</text><text x="48" y="219">Company sample mean</text><text x="48" y="299">Pooled mean</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#405969">
    <text x="48" y="160">Prior center</text><text x="48" y="240">Four noisy observations</text><text x="48" y="320">Half weight on each source</text>
  </g>
  <line x1="585" y1="132" x2="765" y2="212" stroke="#718997" stroke-width="3" stroke-dasharray="7 6"/>
  <line x1="585" y1="132" x2="675" y2="292" stroke="#718997" stroke-width="3" stroke-dasharray="7 6"/>
  <line x1="765" y1="212" x2="675" y2="292" stroke="#718997" stroke-width="3" stroke-dasharray="7 6"/>
  <circle cx="585" cy="132" r="11" fill="#226f7d"/><circle cx="765" cy="212" r="11" fill="#b65e29"/><circle cx="675" cy="292" r="12" fill="#253b7a"/>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700"><text x="604" y="138" fill="#174c56">1%</text><text x="784" y="218" fill="#87411d">3%</text><text x="694" y="298" fill="#253b7a">2%</text></g>
  <text x="48" y="366" font-family="Arial, sans-serif" font-size="16" fill="#17364a">Mean ±1 SD</text>
  <line x1="611" y1="360" x2="739" y2="360" stroke="#253b7a" stroke-width="12" stroke-linecap="round"/>
  <circle cx="675" cy="360" r="6" fill="#ffffff"/>
  <text x="48" y="416" font-family="Arial, sans-serif" font-size="16" fill="#17364a">Next return ±1 SD</text>
  <line x1="484" y1="410" x2="866" y2="410" stroke="#9db5c9" stroke-width="12" stroke-linecap="round"/>
  <circle cx="675" cy="410" r="6" fill="#253b7a"/>
  <rect x="48" y="522" width="16" height="16" fill="#253b7a"/><text x="75" y="536" font-family="Arial, sans-serif" font-size="15" fill="#17364a">Posterior mean: 2% · SD 0.71 points</text>
  <rect x="500" y="522" width="16" height="16" fill="#9db5c9"/><text x="527" y="536" font-family="Arial, sans-serif" font-size="15" fill="#17364a">Next return: 2% · SD 2.12 points</text>
</svg>
