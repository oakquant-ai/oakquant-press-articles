<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="t d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Five places a page can be lost in AI search</title>
  <desc id="d">Five steps a page goes through in AI search: found, chosen, credited, clicked and came back. Under the steps, a band asks whether the answer describes the work correctly.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#2B2B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="720" fill="#FAF7F1"/>

  <!-- heading -->
  <text x="70" y="92" font-size="20" letter-spacing="4" fill="#9B5331">FIVE PLACES A PAGE CAN BE LOST IN AI SEARCH</text>
  <line x1="70" y1="120" x2="1530" y2="120" stroke="#1C1C1C" stroke-width="1.5"/>

  <!-- step boxes: x = 70 + i*306, width 236 -->
  <g stroke="#1C1C1C" stroke-width="1.6" fill="#FFFFFF">
    <rect x="70"   y="170" width="236" height="150" rx="6"/>
    <rect x="376"  y="170" width="236" height="150" rx="6"/>
    <rect x="682"  y="170" width="236" height="150" rx="6"/>
    <rect x="988"  y="170" width="236" height="150" rx="6"/>
    <rect x="1294" y="170" width="236" height="150" rx="6"/>
  </g>

  <!-- step numbers -->
  <g font-size="18" letter-spacing="3" fill="#9B5331">
    <text x="96"   y="212">01</text>
    <text x="402"  y="212">02</text>
    <text x="708"  y="212">03</text>
    <text x="1014" y="212">04</text>
    <text x="1320" y="212">05</text>
  </g>

  <!-- step names -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#1C1C1C">
    <text x="96"   y="282">Found</text>
    <text x="402"  y="282">Chosen</text>
    <text x="708"  y="282">Credited</text>
    <text x="1014" y="282">Clicked</text>
    <text x="1320" y="282">Came back</text>
  </g>

  <!-- arrows between boxes -->
  <g stroke="#2B2B2B" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="312"  y1="245" x2="368"  y2="245"/>
    <line x1="618"  y1="245" x2="674"  y2="245"/>
    <line x1="924"  y1="245" x2="980"  y2="245"/>
    <line x1="1230" y1="245" x2="1286" y2="245"/>
  </g>

  <!-- what each step needs, or how it fails -->
  <g font-size="22" fill="#4A4A4A">
    <text x="96" y="378">Indexed and allowed</text>
    <text x="96" y="408">to show a snippet</text>

    <text x="402" y="378">Lost if the tool</text>
    <text x="402" y="408">uses other pages</text>

    <text x="708" y="378">Lost if the credit</text>
    <text x="708" y="408">goes to a copy</text>

    <text x="1014" y="378">Lost if the reader</text>
    <text x="1014" y="408">stops at the answer</text>

    <text x="1320" y="378">Lost if the reader</text>
    <text x="1320" y="408">never returns</text>
  </g>
  <g stroke="#9B5331" stroke-width="3">
    <line x1="402"  y1="346" x2="432"  y2="346"/>
    <line x1="708"  y1="346" x2="738"  y2="346"/>
    <line x1="1014" y1="346" x2="1044" y2="346"/>
    <line x1="1320" y1="346" x2="1350" y2="346"/>
  </g>
  <line x1="96" y1="346" x2="126" y2="346" stroke="#1F6F54" stroke-width="3"/>

  <!-- accuracy band under all five steps -->
  <rect x="70" y="480" width="1460" height="96" rx="6" fill="#EEF4F1" stroke="#1F6F54" stroke-width="1.6"/>
  <text x="102" y="520" font-size="18" letter-spacing="3" fill="#1F6F54">AT EVERY STEP</text>
  <text x="102" y="556" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1C1C1C">Does the answer describe your work correctly?</text>

  <!-- source line -->
  <text x="1530" y="660" font-size="18" fill="#7A7A7A" text-anchor="end">When Search Writes the Answer · press.oakquant.ai</text>
</svg>
