title: When Search Writes the Answer
summary: AI search answers questions using other people's work. This essay explains
  generative engine optimization (GEO), what a publisher can do to be cited, and why
  a citation is different from a reader. It ends with a GEO checklist for your own
  site that I update as platforms change and my tests show new results.
