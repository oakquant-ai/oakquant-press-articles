<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>The three-probabilism composition</title>
  <desc>Two probabilistic components, generative cognition and statistical prediction, sit above a deterministic workflow coordination substrate that performs governance and policy, case state and durability, audit and compliance, and composition rules.</desc>

  <rect x="40" y="40" width="290" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="185" y="74" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Generative cognition</text>
  <text x="185" y="96" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#534AB7">Probabilistic. Language-shaped.</text>

  <rect x="350" y="40" width="290" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="495" y="74" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Statistical prediction</text>
  <text x="495" y="96" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#534AB7">Probabilistic. Quantitative.</text>

  <line x1="185" y1="120" x2="185" y2="160" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="495" y1="120" x2="495" y2="160" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>

  <rect x="40" y="160" width="600" height="200" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="186" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Workflow coordination</text>
  <text x="340" y="208" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0F6E56">Deterministic substrate. Governs the composition.</text>

  <rect x="60" y="240" width="135" height="100" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="127" y="270" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Governance</text>
  <text x="127" y="290" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0F6E56">and policy</text>

  <rect x="207" y="240" width="135" height="100" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="274" y="270" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Case state</text>
  <text x="274" y="290" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0F6E56">and durability</text>

  <rect x="354" y="240" width="135" height="100" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="421" y="270" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Audit and</text>
  <text x="421" y="290" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0F6E56">compliance</text>

  <rect x="501" y="240" width="135" height="100" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="568" y="270" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#085041">Composition</text>
  <text x="568" y="290" text-anchor="middle" dominant-baseline="central" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0F6E56">and orchestration</text>
</svg>
