title: Magnifica Humanitas and the Work of Building Good Tools
summary: A Pope, two bank CIOs, and the sovereign-AI debate all converged this spring
  on one question about artificial intelligence and human dignity. The most useful
  answer is not agreement in the abstract but a concrete account of what it looks
  like to build and write with these systems well, and where it could go wrong.
