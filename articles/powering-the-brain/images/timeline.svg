<svg width="1100" height="452" viewBox="0 0 1100 452" role="img" aria-label="Timeline from December 2026 to May 2027: development setup, staging migration, production hardware, AT&amp;T activation, cutovers and DigitalOcean retirement" xmlns="http://www.w3.org/2000/svg"><defs><style>
svg{--bg:#F5F7F5;--surface:#FFFFFF;--ink:#14201A;--muted:#52615A;--rule:#D8E0DA;--accent:#1F5C45;
--dev:#3F6FA8;--prod:#1F5C45;--net:#6B5B95;--cut:#A8552B;background:var(--surface)}
@media (prefers-color-scheme:dark){svg{--bg:#0E1411;--surface:#151D18;--ink:#E5EDE8;--muted:#9BAAA1;--rule:#27332C;--accent:#62C29A;
--dev:#7FA9DD;--prod:#62C29A;--net:#ABA0D2;--cut:#E38D60}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
.t{fill:var(--ink);font-size:14px}.t.b{font-weight:600}.t.s{fill:var(--muted);font-size:13px}.t.s.b{fill:var(--ink)}
.t.m{fill:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.t.eyebrow{fill:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.12em;font-weight:600}
.t.accent-t{fill:var(--accent)}
.panel{fill:var(--bg);stroke:var(--rule)}
.box{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}.box.dev{stroke:var(--dev);stroke-width:2}.box.prod{stroke:var(--prod);stroke-width:2}
.box.heavy{fill:color-mix(in srgb,var(--cut) 16%,var(--surface));stroke:var(--cut)}
.dash-box{stroke-dasharray:5 4}
.cloud{fill:color-mix(in srgb,var(--muted) 8%,transparent);stroke:var(--muted);stroke-dasharray:2 4}
.ups{fill:color-mix(in srgb,var(--prod) 6%,transparent);stroke:var(--prod);stroke-dasharray:6 4;stroke-width:1.4}
.net-bar{fill:color-mix(in srgb,var(--net) 18%,var(--surface));stroke:var(--net)}
.line{stroke:var(--muted);stroke-width:1.5;fill:none}.line.dash{stroke-dasharray:5 4}
.arrowhead{fill:var(--muted)}.grid{stroke:var(--rule);stroke-width:1}
.lane{fill:transparent}.lane.alt{fill:color-mix(in srgb,var(--muted) 6%,transparent)}
.bar.dev{fill:var(--dev)}.bar.prod{fill:var(--prod)}.bar.net{fill:var(--net)}.bar.cut{fill:var(--cut)}
.diamond{fill:var(--accent);stroke:var(--surface);stroke-width:2}.diamond.cut{fill:var(--cut)}
.hatch-fill{fill:transparent}.bar-outline{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
.hatch-line{stroke:var(--muted);opacity:.55}
</style><marker id="tl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrowhead"/></marker><pattern id="hatch-tl" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" class="hatch-line" stroke-width="2.5"/></pattern></defs><rect x="10" y="58" width="1080" height="76" rx="0" class="lane alt"/><text x="24" y="101.0" class="t b" text-anchor="start">Purchases</text><rect x="10" y="134" width="1080" height="76" rx="0" class="lane"/><text x="24" y="177.0" class="t b" text-anchor="start">Development and staging</text><rect x="10" y="210" width="1080" height="76" rx="0" class="lane alt"/><text x="24" y="253.0" class="t b" text-anchor="start">Production hardware</text><rect x="10" y="286" width="1080" height="76" rx="0" class="lane"/><text x="24" y="329.0" class="t b" text-anchor="start">Connectivity</text><rect x="10" y="362" width="1080" height="76" rx="0" class="lane alt"/><text x="24" y="405.0" class="t b" text-anchor="start">Cutover and retirement</text><line x1="190.0" y1="50" x2="190.0" y2="438" class="grid"/><text x="259.25" y="36" class="t m" text-anchor="middle">Dec 2026</text><line x1="328.5" y1="50" x2="328.5" y2="438" class="grid"/><text x="397.75" y="36" class="t m" text-anchor="middle">Jan</text><line x1="467.0" y1="50" x2="467.0" y2="438" class="grid"/><text x="529.5" y="36" class="t m" text-anchor="middle">Feb</text><line x1="592.0" y1="50" x2="592.0" y2="438" class="grid"/><text x="661.25" y="36" class="t m" text-anchor="middle">Mar</text><line x1="730.5" y1="50" x2="730.5" y2="438" class="grid"/><text x="797.5" y="36" class="t m" text-anchor="middle">Apr</text><line x1="864.5" y1="50" x2="864.5" y2="438" class="grid"/><text x="933.75" y="36" class="t m" text-anchor="middle">May</text><line x1="1003.0" y1="50" x2="1003.0" y2="438" class="grid"/><text x="1036.5" y="36" class="t m" text-anchor="middle">Jun</text><path d="M252.5 87.0 L261.5 96.0 L252.5 105.0 L243.5 96.0 Z" class="diamond buy"/><text x="268.5" y="101.0" class="t s" text-anchor="start">Dec 15: Mac mini and monitor</text><path d="M592.0 87.0 L601.0 96.0 L592.0 105.0 L583.0 96.0 Z" class="diamond buy"/><text x="608.0" y="101.0" class="t s" text-anchor="start">Mar 1: Mac Studio, UPS, backup drive</text><rect x="252.5" y="180" width="76.0" height="16" rx="3" class="bar dev"/><text x="252.5" y="174" class="t s" text-anchor="start">Setup</text><rect x="328.5" y="180" width="138.5" height="16" rx="3" class="bar dev"/><text x="328.5" y="156" class="t s" text-anchor="start">Timber and staging migration</text><rect x="467.0" y="180" width="67.0" height="16" rx="3" class="bar dev"/><text x="467.0" y="174" class="t s" text-anchor="start">Tests and sizing</text><rect x="534.0" y="180" width="58.0" height="16" rx="3" class="bar dev"/><text x="534.0" y="156" class="t s" text-anchor="start">Rehearsals</text><rect x="592.0" y="256" width="67.0" height="16" rx="3" class="bar prod"/><text x="592.0" y="250" class="t s" text-anchor="start">Delivery and install</text><rect x="659.0" y="256" width="71.5" height="16" rx="3" class="bar prod"/><text x="659.0" y="232" class="t s" text-anchor="start">Configure and rehearse</text><rect x="730.5" y="332" width="31.3" height="16" rx="3" class="bar net"/><text x="730.5" y="326" class="t s" text-anchor="start">AT&amp;T activation</text><rect x="761.8" y="332" width="62.5" height="16" rx="3" class="bar net"/><text x="761.8" y="308" class="t s" text-anchor="start">Parallel validation</text><rect x="824.3" y="408" width="31.3" height="16" rx="3" class="bar cut"/><text x="824.3" y="402" class="t s" text-anchor="start">Cutovers</text><rect x="855.6" y="408" width="62.5" height="16" rx="3" class="bar cut"/><text x="855.6" y="384" class="t s" text-anchor="start">Rollback window</text><path d="M918.1 391.0 L927.1 400.0 L918.1 409.0 L909.1 400.0 Z" class="diamond cut"/><text x="934.1" y="405.0" class="t s" text-anchor="start">May 13: retire</text></svg>