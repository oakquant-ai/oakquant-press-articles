<svg width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-label="Before and after: Timber today bundles heavy ML and vector dependencies in one install; the target is a thin client calling independently deployed services through a versioned, authenticated contract" xmlns="http://www.w3.org/2000/svg"><defs><style>
svg{--bg:#F5F7F5;--surface:#FFFFFF;--ink:#14201A;--muted:#52615A;--rule:#D8E0DA;--accent:#1F5C45;
--dev:#3F6FA8;--prod:#1F5C45;--net:#6B5B95;--cut:#A8552B;background:var(--surface)}
@media (prefers-color-scheme:dark){svg{--bg:#0E1411;--surface:#151D18;--ink:#E5EDE8;--muted:#9BAAA1;--rule:#27332C;--accent:#62C29A;
--dev:#7FA9DD;--prod:#62C29A;--net:#ABA0D2;--cut:#E38D60}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
.t{fill:var(--ink);font-size:14px}.t.b{font-weight:600}.t.s{fill:var(--muted);font-size:13px}.t.s.b{fill:var(--ink)}
.t.m{fill:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.t.eyebrow{fill:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.12em;font-weight:600}
.t.accent-t{fill:var(--accent)}
.panel{fill:var(--bg);stroke:var(--rule)}
.box{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}.box.dev{stroke:var(--dev);stroke-width:2}.box.prod{stroke:var(--prod);stroke-width:2}
.box.heavy{fill:color-mix(in srgb,var(--cut) 16%,var(--surface));stroke:var(--cut)}
.dash-box{stroke-dasharray:5 4}
.cloud{fill:color-mix(in srgb,var(--muted) 8%,transparent);stroke:var(--muted);stroke-dasharray:2 4}
.ups{fill:color-mix(in srgb,var(--prod) 6%,transparent);stroke:var(--prod);stroke-dasharray:6 4;stroke-width:1.4}
.net-bar{fill:color-mix(in srgb,var(--net) 18%,var(--surface));stroke:var(--net)}
.line{stroke:var(--muted);stroke-width:1.5;fill:none}.line.dash{stroke-dasharray:5 4}
.arrowhead{fill:var(--muted)}.grid{stroke:var(--rule);stroke-width:1}
.lane{fill:transparent}.lane.alt{fill:color-mix(in srgb,var(--muted) 6%,transparent)}
.bar.dev{fill:var(--dev)}.bar.prod{fill:var(--prod)}.bar.net{fill:var(--net)}.bar.cut{fill:var(--cut)}
.diamond{fill:var(--accent);stroke:var(--surface);stroke-width:2}.diamond.cut{fill:var(--cut)}
.hatch-fill{fill:transparent}.bar-outline{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
.hatch-line{stroke:var(--muted);opacity:.55}
</style><marker id="tim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrowhead"/></marker><pattern id="hatch-tim" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" class="hatch-line" stroke-width="2.5"/></pattern></defs><rect x="20" y="20" width="450" height="360" rx="6" class="panel"/><rect x="530" y="20" width="550" height="360" rx="6" class="panel"/><text x="44" y="52" class="t eyebrow" text-anchor="start">BEFORE</text><text x="554" y="52" class="t eyebrow accent-t" text-anchor="start">AFTER</text><rect x="44" y="168" width="100" height="60" rx="6" class="box"/><text x="94.0" y="203.0" class="t b" text-anchor="middle">App</text><line x1="146" y1="198" x2="188" y2="198" class="line" marker-end="url(#tim)"/><rect x="190" y="70" width="260" height="280" rx="10" class="cloud"/><text x="206" y="96" class="t b" text-anchor="start">Timber, one install</text><rect x="206" y="110" width="228" height="36" rx="6" class="box"/><text x="320.0" y="133.0" class="t b" text-anchor="middle">Configuration</text><rect x="206" y="156" width="228" height="36" rx="6" class="box heavy"/><text x="320.0" y="179.0" class="t b" text-anchor="middle">Tokenization</text><rect x="206" y="202" width="228" height="36" rx="6" class="box heavy"/><text x="320.0" y="225.0" class="t b" text-anchor="middle">Embeddings</text><rect x="206" y="248" width="228" height="36" rx="6" class="box heavy"/><text x="320.0" y="271.0" class="t b" text-anchor="middle">Vector operations</text><rect x="206" y="294" width="228" height="36" rx="6" class="box heavy"/><text x="320.0" y="317.0" class="t b" text-anchor="middle">ML execution</text><text x="44" y="360" class="t s" text-anchor="start">Heavy dependencies are mandatory</text><rect x="550" y="168" width="90" height="60" rx="6" class="box"/><text x="595.0" y="203.0" class="t b" text-anchor="middle">App</text><line x1="642" y1="198" x2="676" y2="198" class="line" marker-end="url(#tim)"/><rect x="678" y="130" width="140" height="136" rx="6" class="box prod"/><text x="748.0" y="184.0" class="t b" text-anchor="middle">Timber client</text><text x="748.0" y="204.0" class="t s" text-anchor="middle">config and</text><text x="748.0" y="222.0" class="t s" text-anchor="middle">thin adapters</text><rect x="678" y="296" width="140" height="52" rx="6" class="box dash-box"/><text x="748.0" y="316.0" class="t b" text-anchor="middle">Local option</text><text x="748.0" y="336.0" class="t s" text-anchor="middle">optional extra</text><line x1="748" y1="294" x2="748" y2="268" class="line dash" marker-end="url(#tim)"/><line x1="858" y1="76" x2="858" y2="350" class="line dash"/><text x="858" y="72" class="t s" text-anchor="middle">scoped auth, versioned contract</text><rect x="900" y="112" width="160" height="70" rx="6" class="box dev"/><text x="980.0" y="133.0" class="t b" text-anchor="middle">Knowledge</text><text x="980.0" y="153.0" class="t s" text-anchor="middle">and vector service</text><text x="980.0" y="171.0" class="t s" text-anchor="middle">own deploy</text><rect x="900" y="214" width="160" height="70" rx="6" class="box dev"/><text x="980.0" y="243.0" class="t b" text-anchor="middle">ML service</text><text x="980.0" y="263.0" class="t s" text-anchor="middle">own deploy</text><line x1="820" y1="160" x2="898" y2="147" class="line" marker-end="url(#tim)"/><line x1="820" y1="236" x2="898" y2="249" class="line" marker-end="url(#tim)"/><text x="900" y="316" class="t s" text-anchor="start">Async jobs for long work</text><text x="900" y="336" class="t s" text-anchor="start">Remote use is always explicit</text></svg>