<svg width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-label="Before and after: today production runs on DigitalOcean and development on a laptop; by April 2027 production runs on an isolated Mac Studio behind a UPS, with a Mac mini for development and staging, on AT&amp;T fiber with 5G backup" xmlns="http://www.w3.org/2000/svg"><defs><style>
svg{--bg:#F5F7F5;--surface:#FFFFFF;--ink:#14201A;--muted:#52615A;--rule:#D8E0DA;--accent:#1F5C45;
--dev:#3F6FA8;--prod:#1F5C45;--net:#6B5B95;--cut:#A8552B;background:var(--surface)}
@media (prefers-color-scheme:dark){svg{--bg:#0E1411;--surface:#151D18;--ink:#E5EDE8;--muted:#9BAAA1;--rule:#27332C;--accent:#62C29A;
--dev:#7FA9DD;--prod:#62C29A;--net:#ABA0D2;--cut:#E38D60}}
text{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
.t{fill:var(--ink);font-size:14px}.t.b{font-weight:600}.t.s{fill:var(--muted);font-size:13px}.t.s.b{fill:var(--ink)}
.t.m{fill:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.t.eyebrow{fill:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.12em;font-weight:600}
.t.accent-t{fill:var(--accent)}
.panel{fill:var(--bg);stroke:var(--rule)}
.box{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}.box.dev{stroke:var(--dev);stroke-width:2}.box.prod{stroke:var(--prod);stroke-width:2}
.box.heavy{fill:color-mix(in srgb,var(--cut) 16%,var(--surface));stroke:var(--cut)}
.dash-box{stroke-dasharray:5 4}
.cloud{fill:color-mix(in srgb,var(--muted) 8%,transparent);stroke:var(--muted);stroke-dasharray:2 4}
.ups{fill:color-mix(in srgb,var(--prod) 6%,transparent);stroke:var(--prod);stroke-dasharray:6 4;stroke-width:1.4}
.net-bar{fill:color-mix(in srgb,var(--net) 18%,var(--surface));stroke:var(--net)}
.line{stroke:var(--muted);stroke-width:1.5;fill:none}.line.dash{stroke-dasharray:5 4}
.arrowhead{fill:var(--muted)}.grid{stroke:var(--rule);stroke-width:1}
.lane{fill:transparent}.lane.alt{fill:color-mix(in srgb,var(--muted) 6%,transparent)}
.bar.dev{fill:var(--dev)}.bar.prod{fill:var(--prod)}.bar.net{fill:var(--net)}.bar.cut{fill:var(--cut)}
.diamond{fill:var(--accent);stroke:var(--surface);stroke-width:2}.diamond.cut{fill:var(--cut)}
.hatch-fill{fill:transparent}.bar-outline{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
.hatch-line{stroke:var(--muted);opacity:.55}
</style><marker id="inf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="arrowhead"/></marker><pattern id="hatch-inf" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" class="hatch-line" stroke-width="2.5"/></pattern></defs><rect x="20" y="20" width="450" height="420" rx="6" class="panel"/><rect x="530" y="20" width="550" height="420" rx="6" class="panel"/><text x="44" y="52" class="t eyebrow" text-anchor="start">TODAY</text><text x="554" y="52" class="t eyebrow accent-t" text-anchor="start">APRIL 2027 TARGET</text><rect x="50" y="80" width="390" height="220" rx="10" class="cloud"/><text x="70" y="108" class="t b" text-anchor="start">DigitalOcean cloud</text><rect x="70" y="130" width="350" height="56" rx="6" class="box"/><text x="245.0" y="163.0" class="t b" text-anchor="middle">Production applications</text><rect x="70" y="204" width="350" height="56" rx="6" class="box"/><text x="245.0" y="237.0" class="t b" text-anchor="middle">Databases and hosted services</text><rect x="50" y="330" width="200" height="52" rx="6" class="box"/><text x="150.0" y="350.0" class="t b" text-anchor="middle">Laptop</text><text x="150.0" y="370.0" class="t s" text-anchor="middle">development</text><text x="270" y="352" class="t b" text-anchor="start">$388.52 per month</text><text x="270" y="372" class="t s" text-anchor="start">verified current spend</text><text x="50" y="418" class="t s" text-anchor="start">Shared cloud, billed monthly</text><line x1="476" y1="230" x2="524" y2="230" class="line" marker-end="url(#inf)"/><text x="500" y="218" class="t s" text-anchor="middle">migrate</text><rect x="550" y="76" width="510" height="34" rx="6" class="net-bar"/><text x="805" y="98" class="t b" text-anchor="middle">AT&amp;T Business Fiber with 5G backup</text><rect x="550" y="150" width="130" height="112" rx="6" class="box dev"/><text x="615.0" y="192.0" class="t b" text-anchor="middle">Mac mini</text><text x="615.0" y="212.0" class="t s" text-anchor="middle">M5 Pro, 64 GB</text><text x="615.0" y="230.0" class="t s" text-anchor="middle">dev and staging</text><rect x="550" y="306" width="130" height="52" rx="6" class="box"/><text x="615.0" y="326.0" class="t b" text-anchor="middle">Laptop</text><text x="615.0" y="346.0" class="t s" text-anchor="middle">interactive dev</text><line x1="615" y1="306" x2="615" y2="264" class="line" marker-end="url(#inf)"/><text x="626" y="290" class="t s" text-anchor="start">push</text><rect x="738" y="136" width="322" height="214" rx="10" class="ups"/><text x="1046" y="160" class="t s b" text-anchor="end">CyberPower UPS, 1500VA</text><rect x="756" y="182" width="150" height="112" rx="6" class="box prod"/><text x="831.0" y="224.0" class="t b" text-anchor="middle">Mac Studio</text><text x="831.0" y="244.0" class="t s" text-anchor="middle">M5 Ultra, 96 GB</text><text x="831.0" y="262.0" class="t s" text-anchor="middle">production, isolated</text><rect x="942" y="200" width="100" height="76" rx="6" class="box"/><text x="992.0" y="232.0" class="t b" text-anchor="middle">LaCie 4TB</text><text x="992.0" y="252.0" class="t s" text-anchor="middle">local backup</text><line x1="906" y1="238" x2="940" y2="238" class="line" marker-end="url(#inf)"/><line x1="680" y1="206" x2="754" y2="206" class="line" marker-end="url(#inf)"/><text x="717" y="196" class="t s" text-anchor="middle">release</text><line x1="831" y1="112" x2="831" y2="180" class="line" marker-end="url(#inf)"/><text x="820" y="150" class="t s" text-anchor="end">inbound</text><rect x="790" y="392" width="236" height="38" rx="6" class="box dash-box"/><text x="908.0" y="416.0" class="t b" text-anchor="middle">Encrypted off-site copy</text><line x1="831" y1="294" x2="831" y2="390" class="line dash" marker-end="url(#inf)"/><text x="842" y="368" class="t s" text-anchor="start">off-site backup</text></svg>