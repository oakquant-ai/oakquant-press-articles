<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" role="img" aria-label="Overlapping five-day forecast windows" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="720" height="330" fill="#ffffff"/><text x="36" y="34" font-size="15" font-weight="600" fill="#1f2937">Five bets. Roughly one bet of evidence.</text><text x="36" y="58" font-size="12.5" fill="#475569">Each five-day window shares four days with the one above it.</text><text x="177" y="88" font-size="11.5" fill="#475569" text-anchor="middle">d1</text><text x="231" y="88" font-size="11.5" fill="#475569" text-anchor="middle">d2</text><text x="285" y="88" font-size="11.5" fill="#475569" text-anchor="middle">d3</text><text x="339" y="88" font-size="11.5" fill="#475569" text-anchor="middle">d4</text><text x="393" y="88" font-size="11.5" fill="#475569" text-anchor="middle">d5</text><text x="447" y="88" font-size="11.5" fill="#475569" text-anchor="middle">d6</text><text x="501" y="88" font-size="11.5" fill="#475569" text-anchor="middle">d7</text><text x="555" y="88" font-size="11.5" fill="#475569" text-anchor="middle">d8</text><text x="609" y="88" font-size="11.5" fill="#475569" text-anchor="middle">d9</text><text x="136" y="124" font-size="12.5" fill="#1f2937" text-anchor="end">bet 1</text><rect x="150" y="106" width="270" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="2"/><text x="136" y="162" font-size="12.5" fill="#1f2937" text-anchor="end">bet 2</text><rect x="204" y="144" width="216" height="26" fill="#b45309" opacity="0.20"/><rect x="204" y="144" width="270" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="2"/><text x="136" y="200" font-size="12.5" fill="#1f2937" text-anchor="end">bet 3</text><rect x="258" y="182" width="216" height="26" fill="#b45309" opacity="0.20"/><rect x="258" y="182" width="270" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="2"/><text x="136" y="238" font-size="12.5" fill="#1f2937" text-anchor="end">bet 4</text><rect x="312" y="220" width="216" height="26" fill="#b45309" opacity="0.20"/><rect x="312" y="220" width="270" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="2"/><text x="136" y="276" font-size="12.5" fill="#1f2937" text-anchor="end">bet 5</text><rect x="366" y="258" width="216" height="26" fill="#b45309" opacity="0.20"/><rect x="366" y="258" width="270" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="2"/><rect x="204" y="106" width="216" height="26" rx="4" fill="#b45309" opacity="0.20"/><text x="36" y="318" font-size="11.5" fill="#475569">Shaded = days already counted by an earlier bet. 80% of every window is not new evidence.</text></svg>
