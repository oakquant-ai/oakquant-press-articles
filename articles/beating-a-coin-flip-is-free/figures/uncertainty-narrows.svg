<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" role="img" aria-label="Prediction intervals narrowing as observations accumulate" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="720" height="330" fill="#ffffff"/><text x="36" y="34" font-size="15" font-weight="600" fill="#1f2937">A wider denominator is a narrower claim</text><line x1="375.0" y1="70" x2="375.0" y2="285" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/><text x="375.0" y="303" font-size="12" fill="#b45309" text-anchor="middle">50% — a coin flip</text><line x1="158.4" y1="110" x2="614.4" y2="110" stroke="#15803d" stroke-width="9" stroke-linecap="round" opacity="0.30"/><line x1="158.4" y1="99" x2="158.4" y2="121" stroke="#15803d" stroke-width="2"/><line x1="614.4" y1="99" x2="614.4" y2="121" stroke="#15803d" stroke-width="2"/><circle cx="386.4" cy="110" r="5" fill="#15803d"/><text x="76" y="115" font-size="13" fill="#1f2937" text-anchor="end">n = 6</text><text x="626.4" y="115" font-size="11.5" fill="#475569">±40.0 pts</text><line x1="314.3" y1="170" x2="458.5" y2="170" stroke="#15803d" stroke-width="9" stroke-linecap="round" opacity="0.30"/><line x1="314.3" y1="159" x2="314.3" y2="181" stroke="#15803d" stroke-width="2"/><line x1="458.5" y1="159" x2="458.5" y2="181" stroke="#15803d" stroke-width="2"/><circle cx="386.4" cy="170" r="5" fill="#15803d"/><text x="76" y="175" font-size="13" fill="#1f2937" text-anchor="end">n = 60</text><text x="470.5" y="175" font-size="11.5" fill="#475569">±12.7 pts</text><line x1="363.6" y1="230" x2="409.2" y2="230" stroke="#15803d" stroke-width="9" stroke-linecap="round" opacity="0.30"/><line x1="363.6" y1="219" x2="363.6" y2="241" stroke="#15803d" stroke-width="2"/><line x1="409.2" y1="219" x2="409.2" y2="241" stroke="#15803d" stroke-width="2"/><circle cx="386.4" cy="230" r="5" fill="#15803d"/><text x="76" y="235" font-size="13" fill="#1f2937" text-anchor="end">n = 600</text><text x="421.2" y="235" font-size="11.5" fill="#475569">±4.0 pts</text><text x="36" y="58" font-size="12.5" fill="#475569">Estimate held at 52%. Only the interval moves.</text><text x="36" y="322" font-size="11.5" fill="#475569">Even 600 observations leave a 2-point edge undecided — the band still crosses 50%.</text></svg>
