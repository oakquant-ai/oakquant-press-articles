<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="100%" role="img" aria-label="One news board attributed across many symbols" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="740" height="400" fill="#ffffff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker></defs><text x="34" y="32" font-size="15" font-weight="600" fill="#1f2937">One board. Three hundred hats.</text><text x="34" y="54" font-size="12" fill="#475569">Every symbol forecast on a given day is scored against the same news board.</text><rect x="260.0" y="86" width="220" height="46" rx="7" fill="none" stroke="#b45309" stroke-width="2.5"/><text x="370.0" y="115" font-size="13" fill="#1f2937" text-anchor="middle">today's board — 8 themes</text><line x1="370.0" y1="134" x2="70" y2="196" stroke="#475569" stroke-width="1" opacity="0.55"/><rect x="54" y="196" width="32" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="1.4"/><line x1="370.0" y1="134" x2="116" y2="196" stroke="#475569" stroke-width="1" opacity="0.55"/><rect x="100" y="196" width="32" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="1.4"/><line x1="370.0" y1="134" x2="162" y2="196" stroke="#475569" stroke-width="1" opacity="0.55"/><rect x="146" y="196" width="32" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="1.4"/><line x1="370.0" y1="134" x2="208" y2="196" stroke="#475569" stroke-width="1" opacity="0.55"/><rect x="192" y="196" width="32" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="1.4"/><line x1="370.0" y1="134" x2="255" y2="196" stroke="#475569" stroke-width="1" opacity="0.55"/><rect x="239" y="196" width="32" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="1.4"/><line x1="370.0" y1="134" x2="301" y2="196" stroke="#475569" stroke-width="1" opacity="0.55"/><rect x="285" y="196" width="32" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="1.4"/><line x1="370.0" y1="134" x2="347" y2="196" stroke="#475569" stroke-width="1" opacity="0.55"/><rect x="331" y="196" width="32" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="1.4"/><line x1="370.0" y1="134" x2="393" y2="196" stroke="#475569" stroke-width="1" opacity="0.55"/><rect x="377" y="196" width="32" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="1.4"/><line x1="370.0" y1="134" x2="439" y2="196" stroke="#475569" stroke-width="1" opacity="0.55"/><rect x="423" y="196" width="32" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="1.4"/><line x1="370.0" y1="134" x2="485" y2="196" stroke="#475569" stroke-width="1" opacity="0.55"/><rect x="469" y="196" width="32" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="1.4"/><line x1="370.0" y1="134" x2="532" y2="196" stroke="#475569" stroke-width="1" opacity="0.55"/><rect x="516" y="196" width="32" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="1.4"/><line x1="370.0" y1="134" x2="578" y2="196" stroke="#475569" stroke-width="1" opacity="0.55"/><rect x="562" y="196" width="32" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="1.4"/><line x1="370.0" y1="134" x2="624" y2="196" stroke="#475569" stroke-width="1" opacity="0.55"/><rect x="608" y="196" width="32" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="1.4"/><line x1="370.0" y1="134" x2="670" y2="196" stroke="#475569" stroke-width="1" opacity="0.55"/><rect x="654" y="196" width="32" height="26" rx="4" fill="none" stroke="#15803d" stroke-width="1.4"/><text x="370.0" y="248" font-size="12" fill="#475569" text-anchor="middle">... 200 symbols, each producing an attribution</text><rect x="120" y="272" width="500" height="58" rx="7" fill="none" stroke="#1f2937" stroke-width="2"/><text x="370.0" y="296" font-size="13" fill="#1f2937" text-anchor="middle">300 attributions that all came from one board</text><text x="370.0" y="317" font-size="11.5" fill="#b45309" text-anchor="middle">counted as 300, n climbs, w climbs, and the theme sounds certain</text><text x="34" y="366" font-size="11.5" fill="#15803d">The fix: count distinct days. De-duplicate to one observation per theme, per sector, per day.</text><text x="34" y="386" font-size="11" fill="#475569">This is the overlapping-windows problem again, one level up — across names instead of across time.</text></svg>
