<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" role="img" aria-label="The estimator as a sum of a price spine and a theme hierarchy" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="760" height="560" fill="#ffffff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker></defs><text x="34" y="34" font-size="15" font-weight="600" fill="#1f2937">The estimator is a sum of two hierarchies</text><text x="34" y="56" font-size="12.5" fill="#475569">Every arrow is the same operation: shrink a node toward its parent by w = n/(n+K).</text><text x="40" y="90" font-size="12" font-weight="600" fill="#15803d">PRICE SPINE</text><rect x="40" y="100" width="250" height="56" rx="7" fill="none" stroke="#15803d" stroke-width="2"/><text x="165.0" y="124" font-size="13.5" fill="#1f2937" text-anchor="middle">market drift</text><text x="165.0" y="143" font-size="11.5" fill="#475569" text-anchor="middle">the floor — this is always_up</text><line x1="165.0" y1="156" x2="165.0" y2="196" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><text x="175.0" y="180.0" font-size="11" fill="#475569">inherits</text><rect x="40" y="196" width="250" height="56" rx="7" fill="none" stroke="#15803d" stroke-width="2"/><text x="165.0" y="220" font-size="13.5" fill="#1f2937" text-anchor="middle">sector deviation</text><text x="165.0" y="239" font-size="11.5" fill="#475569" text-anchor="middle">shrunk toward market</text><line x1="165.0" y1="252" x2="165.0" y2="292" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><text x="175.0" y="276.0" font-size="11" fill="#475569">inherits</text><rect x="40" y="292" width="250" height="56" rx="7" fill="none" stroke="#15803d" stroke-width="2"/><text x="165.0" y="316" font-size="13.5" fill="#1f2937" text-anchor="middle">symbol deviation</text><text x="165.0" y="335" font-size="11.5" fill="#475569" text-anchor="middle">shrunk toward sector</text><text x="440" y="90" font-size="12" font-weight="600" fill="#b45309">THEME HIERARCHY</text><rect x="440" y="100" width="250" height="56" rx="7" fill="none" stroke="#b45309" stroke-width="2"/><text x="565.0" y="124" font-size="13.5" fill="#1f2937" text-anchor="middle">family</text><text x="565.0" y="143" font-size="11.5" fill="#475569" text-anchor="middle">e.g. macro</text><line x1="565.0" y1="156" x2="565.0" y2="196" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><text x="575.0" y="180.0" font-size="11" fill="#475569">inherits</text><rect x="440" y="196" width="250" height="56" rx="7" fill="none" stroke="#b45309" stroke-width="2"/><text x="565.0" y="220" font-size="13.5" fill="#1f2937" text-anchor="middle">theme</text><text x="565.0" y="239" font-size="11.5" fill="#475569" text-anchor="middle">e.g. central_bank_policy</text><line x1="565.0" y1="252" x2="565.0" y2="292" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><text x="575.0" y="276.0" font-size="11" fill="#475569">inherits</text><rect x="440" y="292" width="250" height="56" rx="7" fill="none" stroke="#b45309" stroke-width="2"/><text x="565.0" y="316" font-size="13.5" fill="#1f2937" text-anchor="middle">theme × sector</text><text x="565.0" y="335" font-size="11.5" fill="#475569" text-anchor="middle">credited only with the residual</text><path d="M165.0,348 L165.0,400 L380.0,400" fill="none" stroke="#475569" stroke-width="1.6"/><path d="M565.0,348 L565.0,400 L380.0,400" fill="none" stroke="#475569" stroke-width="1.6"/><line x1="380.0" y1="400" x2="380.0" y2="428" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="434" width="680" height="60" rx="7" fill="none" stroke="#1f2937" stroke-width="2"/><text x="380.0" y="459" font-size="13.5" fill="#1f2937" text-anchor="middle">estimate(symbol) = market drift + sector dev + symbol dev + &#931; themes firing now</text><text x="380.0" y="479" font-size="11.5" fill="#475569" text-anchor="middle">n = 0 gives w = 0, so an unknown node is exactly its parent — the estimate falls back to the market drift, by arithmetic.</text><text x="34" y="544" font-size="11.5" fill="#475569">A theme is credited with actual &#8722; spine expected, so the two hierarchies cannot both claim the same move.</text></svg>
