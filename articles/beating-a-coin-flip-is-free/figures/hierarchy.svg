<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" width="100%" role="img" aria-label="Macro as a bounded additive term" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="780" height="600" fill="#ffffff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker></defs><text x="34" y="32" font-size="15" font-weight="600" fill="#1f2937">Macro is a term in the answer, not an alternative to it</text><text x="34" y="54" font-size="12" fill="#475569">Every arrow is the same shrinkage, w = n/(n+K). The two hierarchies are then added, not chosen between.</text><text x="40" y="86" font-size="11.5" font-weight="600" fill="#15803d">PRICE SPINE</text><rect x="40" y="96" width="248" height="54" rx="7" fill="none" stroke="#15803d" stroke-width="2"/><text x="164.0" y="119" font-size="13" fill="#1f2937" text-anchor="middle">market drift</text><text x="164.0" y="137" font-size="11" fill="#475569" text-anchor="middle">the intended floor — always_up</text><line x1="164.0" y1="150" x2="164.0" y2="184" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><text x="173.0" y="172" font-size="10.5" fill="#475569">inherits</text><rect x="40" y="184" width="248" height="54" rx="7" fill="none" stroke="#15803d" stroke-width="2"/><text x="164.0" y="207" font-size="13" fill="#1f2937" text-anchor="middle">sector deviation</text><text x="164.0" y="225" font-size="11" fill="#475569" text-anchor="middle">shrunk toward market</text><line x1="164.0" y1="238" x2="164.0" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><text x="173.0" y="260" font-size="10.5" fill="#475569">inherits</text><rect x="40" y="272" width="248" height="54" rx="7" fill="none" stroke="#15803d" stroke-width="2"/><text x="164.0" y="295" font-size="13" fill="#1f2937" text-anchor="middle">symbol deviation</text><text x="164.0" y="313" font-size="11" fill="#475569" text-anchor="middle">shrunk toward sector</text><text x="470" y="86" font-size="11.5" font-weight="600" fill="#b45309">THEME HIERARCHY</text><rect x="470" y="96" width="248" height="54" rx="7" fill="none" stroke="#b45309" stroke-width="2"/><text x="594.0" y="119" font-size="13" fill="#1f2937" text-anchor="middle">family</text><text x="594.0" y="137" font-size="11" fill="#475569" text-anchor="middle">e.g. macro</text><line x1="594.0" y1="150" x2="594.0" y2="184" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><text x="603.0" y="172" font-size="10.5" fill="#475569">inherits</text><rect x="470" y="184" width="248" height="54" rx="7" fill="none" stroke="#b45309" stroke-width="2"/><text x="594.0" y="207" font-size="13" fill="#1f2937" text-anchor="middle">theme</text><text x="594.0" y="225" font-size="11" fill="#475569" text-anchor="middle">stable versioned id</text><line x1="594.0" y1="238" x2="594.0" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><text x="603.0" y="260" font-size="10.5" fill="#475569">inherits</text><rect x="470" y="272" width="248" height="54" rx="7" fill="none" stroke="#b45309" stroke-width="2"/><text x="594.0" y="295" font-size="13" fill="#1f2937" text-anchor="middle">theme x sector</text><text x="594.0" y="313" font-size="11" fill="#475569" text-anchor="middle">credited with residual x wi / sum w</text><text x="164.0" y="346" font-size="11.5" fill="#15803d" text-anchor="middle">base estimate</text><text x="594.0" y="346" font-size="11.5" fill="#b45309" text-anchor="middle">theme adjustment</text><path d="M164.0,326 L164.0,366 L390.0,366" fill="none" stroke="#475569" stroke-width="1.5"/><path d="M594.0,326 L594.0,366 L390.0,366" fill="none" stroke="#475569" stroke-width="1.5"/><line x1="390.0" y1="366" x2="390.0" y2="392" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="398" width="700" height="52" rx="7" fill="none" stroke="#1f2937" stroke-width="2"/><text x="390.0" y="430" font-size="14" fill="#1f2937" text-anchor="middle">final = base estimate + w_macro &#215; theme adjustment</text><text x="40" y="468" font-size="11.5" fill="#1f2937">macro share of the answer = |macro| / (|base| + |macro|)</text><rect x="80" y="478" width="620" height="20" rx="4" fill="#d1d5db" opacity="0.5"/><rect x="266" y="478" width="124" height="20" rx="3" fill="#b45309" opacity="0.30"/><line x1="204" y1="472" x2="204" y2="504" stroke="#15803d" stroke-width="2"/><text x="204" y="520" font-size="11" fill="#15803d" text-anchor="middle">floor 10%</text><line x1="514" y1="472" x2="514" y2="504" stroke="#b45309" stroke-width="2"/><text x="514" y="520" font-size="11" fill="#b45309" text-anchor="middle">ceiling 35%</text><text x="328" y="492" font-size="10.5" fill="#b45309" text-anchor="middle">15-25% target</text><text x="34" y="584" font-size="11" fill="#475569">The 15-25% band is a PRIOR, not a finding. It is borrowed from published variance decompositions, not measured on our bets.</text></svg>
