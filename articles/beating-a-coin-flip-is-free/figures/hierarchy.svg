<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610" width="100%" role="img" aria-label="Two rooted hierarchies combined additively" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="800" height="610" fill="#ffffff"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker></defs><text x="34" y="30" font-size="15" font-weight="600" fill="#1f2937">Two hierarchies, both rooted. Neither starts at zero.</text><text x="34" y="52" font-size="11.5" fill="#475569">Every arrow is w = n/(n+K). A node with no evidence is exactly its parent.</text><text x="40" y="84" font-size="11" font-weight="600" fill="#15803d">PRICE SPINE</text><rect x="40" y="94" width="262" height="52" rx="7" fill="none" stroke="#15803d" stroke-width="2"/><text x="171.0" y="116" font-size="12.5" fill="#1f2937" text-anchor="middle">market drift</text><text x="171.0" y="134" font-size="10.5" fill="#475569" text-anchor="middle">MEASURED — this is always_up</text><line x1="171.0" y1="146" x2="171.0" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="180" width="262" height="52" rx="7" fill="none" stroke="#15803d" stroke-width="2"/><text x="171.0" y="202" font-size="12.5" fill="#1f2937" text-anchor="middle">sector deviation</text><text x="171.0" y="220" font-size="10.5" fill="#475569" text-anchor="middle">shrunk toward market</text><line x1="171.0" y1="232" x2="171.0" y2="266" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="266" width="262" height="52" rx="7" fill="none" stroke="#15803d" stroke-width="2"/><text x="171.0" y="288" font-size="12.5" fill="#1f2937" text-anchor="middle">symbol deviation</text><text x="171.0" y="306" font-size="10.5" fill="#475569" text-anchor="middle">shrunk toward sector</text><text x="498" y="84" font-size="11" font-weight="600" fill="#b45309">THEME HIERARCHY</text><rect x="498" y="94" width="262" height="52" rx="7" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="5 3"/><text x="629.0" y="116" font-size="12.5" fill="#1f2937" text-anchor="middle">board prior</text><text x="629.0" y="134" font-size="10.5" fill="#475569" text-anchor="middle">DECLARED — taxonomy direction x loudness</text><line x1="629.0" y1="146" x2="629.0" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><rect x="498" y="180" width="262" height="52" rx="7" fill="none" stroke="#b45309" stroke-width="2"/><text x="629.0" y="202" font-size="12.5" fill="#1f2937" text-anchor="middle">theme</text><text x="629.0" y="220" font-size="10.5" fill="#475569" text-anchor="middle">shrunk toward family</text><line x1="629.0" y1="232" x2="629.0" y2="266" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><rect x="498" y="266" width="262" height="52" rx="7" fill="none" stroke="#b45309" stroke-width="2"/><text x="629.0" y="288" font-size="12.5" fill="#1f2937" text-anchor="middle">theme x sector</text><text x="629.0" y="306" font-size="10.5" fill="#475569" text-anchor="middle">credited residual x wi / sum w</text><text x="629.0" y="162" font-size="10" fill="#b45309" text-anchor="middle">dashed = a declaration, not a measurement</text><text x="171.0" y="336" font-size="11" fill="#15803d" text-anchor="middle">base estimate</text><text x="629.0" y="336" font-size="11" fill="#b45309" text-anchor="middle">theme adjustment</text><path d="M171.0,344 L171.0,378 L400.0,378" fill="none" stroke="#475569" stroke-width="1.5"/><path d="M629.0,344 L629.0,378 L400.0,378" fill="none" stroke="#475569" stroke-width="1.5"/><line x1="400.0" y1="378" x2="400.0" y2="402" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="408" width="720" height="76" rx="7" fill="none" stroke="#1f2937" stroke-width="2"/><text x="400.0" y="436" font-size="13.5" fill="#1f2937" text-anchor="middle">final = base estimate + w_macro &#215; theme adjustment</text><text x="400.0" y="460" font-size="12" fill="#475569" text-anchor="middle">w_macro = K / (n_symbol + K), clamped to 10%-35%</text><text x="400.0" y="477" font-size="11" fill="#b45309" text-anchor="middle">an unknown symbol leans on the board; one with its own history barely does</text><text x="34" y="596" font-size="11" fill="#475569">On day one, with n = 0 everywhere, the forecast IS the taxonomy's opinion — bounded at 35% of the answer.</text></svg>
