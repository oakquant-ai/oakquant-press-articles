<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" role="img" aria-labelledby="title desc">
  <title id="title">The outcome feedback loop</title>
  <desc id="desc">Four stages: issue an immutable forecast, wait for the target close, receive a checked result, then score and update future forecasts. A correction triggers versioned replay.</desc>
  <rect width="920" height="270" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#102a43">
    <text x="28" y="35" font-size="21" font-weight="700">A forecast learns only after its answer is available</text>
    <g font-size="16" font-weight="700" text-anchor="middle">
      <rect x="28" y="72" width="190" height="92" rx="12" fill="#d9eafa" stroke="#1864ab" stroke-width="2"/>
      <text x="123" y="106">1 · Issue</text><text x="123" y="133" font-size="13" font-weight="400">Freeze probability and target</text>
      <rect x="253" y="72" width="190" height="92" rx="12" fill="#e2f3e9" stroke="#287a50" stroke-width="2"/>
      <text x="348" y="106">2 · Mature</text><text x="348" y="133" font-size="13" font-weight="400">Target session closes</text>
      <rect x="478" y="72" width="190" height="92" rx="12" fill="#fff0cf" stroke="#9a6700" stroke-width="2"/>
      <text x="573" y="106">3 · Verify</text><text x="573" y="133" font-size="13" font-weight="400">Checked result arrives</text>
      <rect x="703" y="72" width="190" height="92" rx="12" fill="#eee5fa" stroke="#6840a0" stroke-width="2"/>
      <text x="798" y="106">4 · Learn</text><text x="798" y="133" font-size="13" font-weight="400">Score; update next issue</text>
    </g>
    <g stroke="#47687d" stroke-width="3" fill="none"><path d="M220 118h29m196 0h29m196 0h29"/></g>
    <g fill="#47687d"><path d="m249 118-9-6v12z M474 118l-9-6v12z M699 118l-9-6v12z"/></g>
    <path d="M573 168v41h225v-41" stroke="#9a6700" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
    <text x="685" y="235" font-size="14" text-anchor="middle">Later correction → versioned replay of learning state</text>
  </g>
</svg>
