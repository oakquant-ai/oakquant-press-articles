<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Joint state scores and a dated relationship</title><desc id="desc">The left panel shows matching sector directions receiving 0.3655 probability each and opposite directions 0.1345 each. The right panel shows a port disruption traveling along a dated uses-port link to a carrier feature, then requiring a forecast test.</desc>
<rect width="1000" height="390" fill="#f7f9fc"/><text x="40" y="45" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#13263d">Two kinds of relationship</text>
<rect x="30" y="70" width="450" height="290" rx="16" fill="#fff" stroke="#c5d2df"/><text x="55" y="105" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#13263d">Joint outcome model</text><text x="55" y="133" font-family="Arial,sans-serif" font-size="15" fill="#42566c">Two sector directions, J = 0.5</text>
<rect x="55" y="157" width="190" height="68" rx="9" fill="#d7eee4"/><text x="72" y="184" font-family="Arial,sans-serif" font-size="16" fill="#123b2d">↑ ↑  matching</text><text x="72" y="208" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#123b2d">0.3655</text>
<rect x="260" y="157" width="190" height="68" rx="9" fill="#d7eee4"/><text x="277" y="184" font-family="Arial,sans-serif" font-size="16" fill="#123b2d">↓ ↓  matching</text><text x="277" y="208" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#123b2d">0.3655</text>
<rect x="55" y="238" width="190" height="68" rx="9" fill="#fceadf"/><text x="72" y="265" font-family="Arial,sans-serif" font-size="16" fill="#6b351e">↑ ↓  opposing</text><text x="72" y="289" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#6b351e">0.1345</text>
<rect x="260" y="238" width="190" height="68" rx="9" fill="#fceadf"/><text x="277" y="265" font-family="Arial,sans-serif" font-size="16" fill="#6b351e">↓ ↑  opposing</text><text x="277" y="289" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#6b351e">0.1345</text>
<rect x="520" y="70" width="450" height="290" rx="16" fill="#fff" stroke="#c5d2df"/><text x="545" y="105" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#13263d">Dated exposure graph</text><text x="545" y="133" font-family="Arial,sans-serif" font-size="15" fill="#42566c">A link supplies a candidate signal</text>
<rect x="550" y="177" width="120" height="55" rx="10" fill="#dceaf8" stroke="#6b93bf"/><text x="575" y="209" font-family="Arial,sans-serif" font-size="16" fill="#13263d">Port event</text><path d="M 675 204 L 801 204" stroke="#436e9b" stroke-width="3" marker-end="url(#arrow)"/><text x="691" y="188" font-family="Arial,sans-serif" font-size="13" fill="#42566c">uses port · dated</text><rect x="807" y="177" width="120" height="55" rx="10" fill="#dceaf8" stroke="#6b93bf"/><text x="833" y="209" font-family="Arial,sans-serif" font-size="16" fill="#13263d">Carrier</text><text x="554" y="277" font-family="Arial,sans-serif" font-size="15" fill="#42566c">Test added value against market and sector factors.</text><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#436e9b"/></marker></defs>
